### Conventions

|                |                 |                              |
| --------------:|:------------------------------------:|:-------------------------------------- |
| variables      | **→** | `user_name`, `max_size`                  |
| functions, methods  | **→** | `read_file()`, `calculate_total()`, `lst.append()`, `s.upper()`       |
| classes        | **→** | `Person`, `BinarySearchTree`             |
| modules        | **→** | `database.py`, `string_utils.py`         |
| packages       | **→** | `requests`, `numpy`, `myproject`         |
| constants      | **→** | `MAX_SIZE`, `DEFAULT_PORT`            |
| private   | **→** | `_value`               |
| private   | **→** | `__value`            |
| special name | **→** | `__init__()`, `__repr__()` |

---

### Type annotations

```py
#!/usr/bin/env python

def max(values: list[int]) -> int:
	m: int = values[0]

	for v in values[1:]:
		if v > m:
			m = v

	return m

def main() -> None:
	lst: list[int] = [12, 8, 25, 3, 17, 42, 9]
	maximum: int = max(lst)

	print(f"Maximum value: {maximum}")

if __name__ == "__main__":
	main()
```

## … Relational Databases with Python …

### Open database connection

```python
...
with psycopg.connect("dbname=postgres user=postgres", autocommit=True) as conn:
*	print("connection opened")
*	# acá se puede usar la connexión `conn`

"es masomenos equivalente a"
```py
conn = psycopg.connect("dbname=postgres user=postgres", autocommit=True)
# acá se puede usar la connexión `conn`
conn.close()
# acá se cerró la conexión
```

???
The connection is automatically closed when leaving the `with` block.

## … Relational Databases with Python …

### Create table, and insert data

```py
with conn.cursor() as cur:
	cur.execute("create table alumne (legajo int, nombre text, apellido text)")

	cur.execute("""
		insert into alumne values (1, 'Cristina', 'Kirchner');

	""")

## Complete example …

```py
#!/usr/bin/env python

import psycopg


def create_database() -> None:
	with psycopg.connect("dbname=postgres user=postgres", autocommit=True) as conn:
		with conn.cursor() as cur:
			cur.execute("create database guarani")

...
```

---
## … Complete example

```py
...

def main() -> None:
	create_database()

	with psycopg.connect("dbname=guarani user=postgres") as conn:
		with conn.cursor() as cur:
			cur.execute("create table alumne (legajo int, nombre text, apellido text)")

			cur.execute("""
				insert into alumne values (1, 'Cristina', 'Kirchner');
				insert into alumne values (2, 'Juan Domingo', 'Perón');
			""")

			cur.execute("select * from alumne")

			for t in cur:
				print(t)

if __name__ == "__main__":
	main()
```

???

Output:
(1, 'Cristina', 'Kirchner')
(2, 'Juan Domingo', 'Perón')

## JSON (JavaScript Object Notation)

  - Structured information
  - Standard, universal support
  - Strings, numbers, booleans, arrays, and objects

---

## JSON data types to Python data types

| | | |
|----------------:|:-:|:------|
| **Object**  | **→** | **`dict`** `{"Belgrano": "Campeón"}` |
| **Array** | **→** | **`list`** `[1, 2, 3]` |
| **String** | **→** | **`str`** `"Vamos Boca`" |
| **Number** | **→** | **`int`**, **`float`** `3.141`5 |
| **`true`**, **`false`** | **→** | **`True`**, **`False`** |
| **`null`** | **→** | **`None`** |


```json
{
	"title": "Casablanca",
	"released": 1942,
	"actors": [
		"Humphrey Bogart",
		"Ingrid Bergman"
	]
}
```

---

## JSON Document

**`movies.json`**
```json
[
	{
		"Title": "Casablanca",
		"released": 1942,
		"Actors": [
			"Humphrey Bogart",
			"Ingrid Bergman"
		]
	},
	{
		"Title": "Lilo & Stitch",
		"released": 2002,
		"color": true,
		"Actors": [
			"Chris Sanders"
		]
	}
]
```

---

#### Python

```py
movie = {
	"title": "Casablanca",
	"year": 1942,
	"color": False,
	"actors": [
		"Humphrey Bogart",
		"Ingrid Bergman",
	],
}
```

#### JSON

```json
{
	"title": "Casablanca",
	"year": 1942,
	"actors": [
		"Humphrey Bogart",
		"Ingrid Bergman"
	]
}
```

???
similarities:

- Both store information as key-value pairs.
- Keys are strings.
- Values may be numbers, strings, booleans, arrays, or nested objects.
- Documents can have arbitrary structure.
- Nested objects are supported.

---

# TinyDB: NoSQL Databases in Python

- Document-oriented NoSQL database
- JSON documents
- Embedded (no server)
- Database: **`filename.json`**

???
```
pip3 install tinydb
```

---

## TinyDB Documents

```python
movie = {
	"title": "Casablanca",
	"year": 1942,
	"color": False,
	"actors": ["Humphrey Bogart", "Ingrid Bergman"],
}

movies_db.insert(movie)
```

Internally, TinyDB serialises the Python dictionary as a JSON document and stores it on disk.

---

## Create Database

```py
from tinydb import TinyDB

movies_db = TinyDB("movies.json")
```

---

## Insert

```py
movies_db.insert({
	"title": "Casablanca",
	"year": 1942,
	"color": False,
	"actors": ["Humphrey Bogart", "Ingrid Bergman"],
})
```

```py
movies_db.insert_multiple([
	{
		"title": "Casablanca",
		"year": 1942,
		"color": False,
		"actors": ["Humphrey Bogart", "Ingrid Bergman"],
	},
	{
		"title": "Lilo & Stitch",
		"year": 2002,
		"color": True,
		"actors": ["Chris Sanders"],
	},
])
```

---

### Reading All Documents

```python
for m in movies_db.all():
	print(m)
```

### Searching Documents

```py
from tinydb import Query

query = Query()

results = movies_db.search(query.year >= 1942)

for movie in results:
	print(movie)
```

---

### Updating Documents

```py
movies_db.update({"year": 1942}, query.title == "Casablanca")
```

### Removing Documents

```python
movies_db.remove(query.year < 1950)
```

---

## Tables

```py
bedelia = TinyDB("bedelia.json")

alumne = bedelia.table("alumne")
materia = bedelia.table("materia")

alumne.insert({"legajo": 626, "nombre": "Diego", "apellido": "Maradona"})
materia.insert({"código": 202, "nombre": "Programación I"})

print(alumne.all())
print(materia.all())
```
